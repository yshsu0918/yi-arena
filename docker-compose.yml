# Run with: docker compose -p poc-boardgameio up -d
# Only the database runs in Docker; the boardgame.io server (Node, Koa) runs on the host
# via scripts/test.sh or `npm start` in server/, and serves the Vue app on 8903.
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: localdb
      POSTGRES_DB: bgio
    ports:
      - "${DB_PORT:-5443}:5432"
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres", "-d", "bgio"]
      interval: 2s
      timeout: 3s
      retries: 30
