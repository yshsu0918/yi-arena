server {
  listen 80;

  location /v2/ {
    proxy_pass http://nakama:7350;
  }

  location /ws {
    proxy_pass http://nakama:7350;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_read_timeout 3600s;
  }

  location / {
    root /usr/share/nginx/html;
    try_files $uri /index.html;
  }
}
